    {
      "title": "用电与账单",
      "path": "electricity",
      "icon": "mdi:transmission-tower",
      "type": "sections",
      "max_columns": 3,
      "sections": [
        {
          "type": "grid",
          "column_span": 2,
          "cards": [
            {
              "type": "heading",
              "heading": "本月用电",
              "heading_style": "title",
