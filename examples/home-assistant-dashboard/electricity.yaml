      "variables": {
        "a_data": "[[[\n const p='sensor.csgaccount_example_account_example_account_';\n const value=(raw)=>raw===null||raw===undefined||String(raw).trim()===''?NaN:Number(raw);\n const number=(id)=>value(states[p+id]?.state);\n const rows=(id,attr)=>{\n   const e=states[p+id];\n   if(!Number.isFinite(value(e?.state)))return [];\n   const data=e?.attributes?.[attr];\n   if(!Array.isArray(data))return [];\n   return [...new Map(data.filter(r=>/^\\d{4}-\\d{2}-\\d{2}$/.test(String(r?.date))&&Number.isFinite(value(r?.kwh))&&value(r.kwh)>=0).map(r=>[r.date,{date:r.date,kwh:value(r.kwh)}])).values()].sort((a,b)=>a.date.localeCompare(b.date));\n };\n const current=rows('this_month_total_usage','this_month_by_day');\n const previous=rows('last_month_total_usage','last_month_by_day');\n const latest=states[p+'latest_day_kwh'];\n const date=Number.isFinite(value(latest?.state))?latest?.attributes?.latest_day_date:null;\n const dateText=(d)=>typeof d==='string'&&/^\\d{4}-\\d{2}-\\d{2}$/.test(d)?`${Number(d.slice(5,7))} 月 ${Number(d.slice(8,10))} 日`:null;\n const today=new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Shanghai'}));\n const todayDate=Date.UTC(today.getFullYear(),today.getMonth(),today.getDate());\n const stamp=date?Date.parse(date+'T00:00:00Z'):NaN;\n const lag=Number.isFinite(stamp)?Math.round((todayDate-stamp)/86400000):null;\n const bill=String(states[p+'last_month_total_cost']?.attributes?.billing_month||'').replace('-','');\n const billLabel=/^\\d{6}$/.test(bill)?`${bill.slice(0,4)} 年 ${Number(bill.slice(4,6))} 月`:'上月';\n let comparison=null;\n if(current.length&&previous.length){\n   const n=Number(current.at(-1).date.slice(8));\n   const a=new Map(current.map(r=>[Number(r.date.slice(8)),r.kwh]));\n   const b=new Map(previous.map(r=>[Number(r.date.slice(8)),r.kwh]));\n   const days=Array.from({length:n},(_,i)=>i+1);\n   if(days.every(d=>a.has(d)&&b.has(d))){\n     const old=days.reduce((s,d)=>s+b.get(d),0),total=days.reduce((s,d)=>s+a.get(d),0);\n     if(old>0)comparison={percent:(total/old-1)*100,days:n,previous:old};\n   }\n }\n return {current,previous,date,dateLabel:dateText(date),lag,billLabel,comparison,monthAverage:current.length?current.reduce((s,r)=>s+r.kwh,0)/current.length:null,balance:number('balance'),arrears:number('arrears'),previousUsage:number('last_month_total_usage')};\n]]]"
      },
