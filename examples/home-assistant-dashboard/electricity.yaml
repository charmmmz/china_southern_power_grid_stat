                "columns": "full",
                "rows": 1
              }
            },
            {
              "type": "custom:button-card",
              "template": "electricity_focus",
              "entity": "sensor.csgaccount_example_account_example_account_this_month_total_usage",
              "name": "本月用电",
              "icon": "mdi:calendar-month",
              "variables": {
                "accent": "#4db6ac",
                "before": "",
                "after": " kWh"
              },
              "grid_options": {
                "columns": 12,
                "rows": "auto"
              },
              "label": "[[[\n const d=variables.a_data,current=d.current;\n if(!current.length)return '等待本月用电数据';\n const date=current.at(-1).date;\n return `截至 ${Number(date.slice(5,7))} 月 ${Number(date.slice(8))} 日 · 已有 ${current.length} 天明细`;\n]]]"
            },
            {
              "type": "custom:button-card",
              "template": "electricity_focus",
              "entity": "sensor.csgaccount_example_account_example_account_latest_day_kwh",
              "name": "最近日用电",
              "icon": "mdi:lightning-bolt",
              "variables": {
                "accent": "#f2cc5c",
                "before": "",
                "after": " kWh"
              },
              "grid_options": {
                "columns": 12,
                "rows": "auto"
              },
              "label": "[[[ const d=variables.a_data;return !d.dateLabel?'等待用电数据':`${d.dateLabel} · ${d.lag===0?'当日数据':d.lag===1?'昨日数据':d.lag>1?'距今 '+d.lag+' 天':'日期待核对'}`; ]]]"
            },
            {
              "type": "custom:button-card",
              "template": "electricity_metric",
              "entity": "sensor.csgaccount_example_account_example_account_this_month_total_usage",
              "name": "本月日均用电",
              "icon": "mdi:chart-bar",
              "variables": {
                "accent": "#4db6ac",
                "before": "",
                "after": " kWh"
              },
              "grid_options": {
                "columns": 12,
                "rows": "auto"
              },
              "state_display": "[[[ const v=variables.a_data.monthAverage;return v===null?'—':v.toFixed(2)+' kWh'; ]]]"
            },
            {
              "type": "custom:button-card",
              "template": "electricity_metric",
              "entity": "sensor.csgaccount_example_account_example_account_this_month_total_usage",
              "name": "[[[ const c=variables.a_data.comparison;return c?`较上月同期（1–${c.days} 日）`:'上月同期明细待齐'; ]]]",
